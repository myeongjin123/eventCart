name: Load test

# 수동 실행 (Actions 탭 → Load test → Run workflow) 또는 load-test 관련 파일이 바뀐 PR
on:
  workflow_dispatch:
    inputs:
      users:
        description: 주문할 회원 수
        default: '500'
      vus:
        description: 동시 사용자(VU) 수
        default: '100'
  pull_request:
    paths:
      - 'load-test/**'
      - '.github/workflows/load-test.yml'

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: eventcart
          MYSQL_USER: eventcart
          MYSQL_PASSWORD: eventcart
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      USERS: ${{ github.event.inputs.users || '500' }}
      VUS: ${{ github.event.inputs.vus || '100' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build jar
        run: ./gradlew bootJar --no-daemon -q

      - name: Start app (MySQL, local profile)
        run: |
          java -Duser.timezone=UTC -jar build/libs/eventcart-*.jar \
            --spring.profiles.active=local \
            --spring.datasource.url='jdbc:mysql://localhost:3306/eventcart?serverTimezone=UTC&characterEncoding=UTF-8' \
            --spring.jpa.show-sql=false \
            --logging.level.root=WARN \
            > app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/events/ongoing > /dev/null && echo "app up after ${i}s" && exit 0
            sleep 1
          done
          echo "app did not start"; cat app.log; exit 1

      - name: Print runner spec
        run: |
          echo "CPU: $(nproc) cores, $(grep 'model name' /proc/cpuinfo | head -1 | cut -d: -f2)"
          free -h | head -2

      - name: k6 - hot (인기 상품 1개 집중)
        run: |
          mkdir -p results
          docker run --rm --network host -u "$(id -u)" \
            -v "$PWD/load-test:/scripts:ro" -v "$PWD/results:/results" \
            -e MODE=hot -e USERS -e VUS -e OUT_DIR=/results \
            grafana/k6:0.54.0 run --quiet /scripts/order-rush.js

      - name: k6 - spread (상품 10개 분산)
        if: always()
        run: |
          docker run --rm --network host -u "$(id -u)" \
            -v "$PWD/load-test:/scripts:ro" -v "$PWD/results:/results" \
            -e MODE=spread -e USERS -e VUS -e OUT_DIR=/results \
            grafana/k6:0.54.0 run --quiet /scripts/order-rush.js

      - name: Job summary
        if: always()
        run: |
          {
            echo "## 부하 테스트 결과"
            echo ""
            echo "러너: $(nproc) cores · 회원 ${USERS}명 · VU ${VUS} · 재고 합계 100 · 1인 1개"
            echo ""
            cat results/result-*.md 2>/dev/null || echo "결과 파일 없음"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: |
            results/
            app.log
