spring:
  application:
    name: eventcart
  profiles:
    default: local
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        format_sql: true

app:
  jwt:
    # 운영에서는 반드시 환경변수 JWT_SECRET로 교체 (Base64, 32바이트 이상)
    secret: ${JWT_SECRET:ZXZlbnRjYXJ0LWxvY2FsLWRldi1zZWNyZXQta2V5LWNoYW5nZS1tZQ==}
    access-token-validity: 1h
  stock-gate:
    key-prefix: eventcart
  order:
    payment-timeout: 10m          # 주문 후 결제 기한
    expiration:
      enabled: true
      interval: PT30S             # 만료 주문 확인 주기
  admin:
    # 비어 있으면 관리자 계정을 만들지 않는다
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://localhost:3306/eventcart?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: eventcart
    password: eventcart
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
app:
  admin:
    email: ${ADMIN_EMAIL:admin@eventcart.dev}
    password: ${ADMIN_PASSWORD:admin1234!}

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:eventcart;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create
app:
  stock-gate:
    # DB를 매번 새로 만드므로 이전 실행의 Redis 키와 겹치지 않게
    key-prefix: eventcart-h2-${random.uuid}
  admin:
    email: ${ADMIN_EMAIL:admin@eventcart.dev}
    password: ${ADMIN_PASSWORD:admin1234!}
