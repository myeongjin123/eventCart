spring:
  application:
    name: eventcart
  profiles:
    default: local
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        format_sql: true

management:
  # 지표·헬스체크는 별도 포트. 외부(로드밸런서)에는 8080만 열고 8081은 내부망(Prometheus)만 접근하게 한다.
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true           # /actuator/health/liveness, /readiness
      show-details: never
  metrics:
    tags:
      application: eventcart
    distribution:
      percentiles-histogram:
        http.server.requests: true   # Grafana에서 p95/p99 계산용

app:
  jwt:
    # 운영에서는 반드시 환경변수 JWT_SECRET로 교체 (Base64, 32바이트 이상)
    secret: ${JWT_SECRET:ZXZlbnRjYXJ0LWxvY2FsLWRldi1zZWNyZXQta2V5LWNoYW5nZS1tZQ==}
    access-token-validity: 1h
  stock-gate:
    key-prefix: eventcart
  order:
    payment-timeout: 10m          # 주문 후 결제 기한
    expiration:
      enabled: true
      interval: PT30S             # 만료 주문 확인 주기
  admin:
    # 비어 있으면 관리자 계정을 만들지 않는다
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://localhost:3306/eventcart?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: eventcart
    password: eventcart
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
app:
  admin:
    email: ${ADMIN_EMAIL:admin@eventcart.dev}
    password: ${ADMIN_PASSWORD:admin1234!}

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:eventcart;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create
app:
  stock-gate:
    # DB를 매번 새로 만드므로 이전 실행의 Redis 키와 겹치지 않게
    key-prefix: eventcart-h2-${random.uuid}
  admin:
    email: ${ADMIN_EMAIL:admin@eventcart.dev}
    password: ${ADMIN_PASSWORD:admin1234!}

---
# Docker 배포용 (deploy/docker-compose.yml). 접속 정보는 모두 환경변수로 받는다.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      # 사이드 프로젝트라 update로 둔다. 실제 운영이면 Flyway로 스키마 이력을 관리하고 validate로 바꾼다.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
app:
  jwt:
    secret: ${JWT_SECRET}         # 기본값 없음: 없으면 기동 실패
logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN

