# DB·Redis 접속 정보는 Testcontainers(@ServiceConnection)가 채운다. → support/TestcontainersConfig
spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_batch_fetch_size: 100

app:
  stock-gate:
    # 테스트 실행마다 새 DB이므로 Redis 키도 매번 새로
    key-prefix: eventcart-test-${random.uuid}
  order:
    payment-timeout: 10m
    expiration:
      enabled: false              # 테스트는 OrderFacade.expireOverdue(시각)를 직접 호출
  jwt:
    secret: dGVzdC1vbmx5LWV2ZW50Y2FydC1qd3Qtc2VjcmV0LWtleS0xMjM0NTY3ODkw
    access-token-validity: 1h
  admin:
    email: admin@test.com
    password: admin1234!
